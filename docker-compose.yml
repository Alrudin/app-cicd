version: '3.8'

services:
  gitlab:
    image: 'gitlab/gitlab-ce:latest'
    hostname: 'localhost'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8080'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
    ports:
      - '8080:80'
    volumes:
      - './gitlab_config:/etc/gitlab'
      - './gitlab_logs:/var/log/gitlab'
      - './gitlab_data:/var/opt/gitlab'

  gitlab-runner:
    image: gitlab/gitlab-runner:alpine
    volumes:
      - './gitlab-runner-config:/etc/gitlab-runner'
      - '/var/run/docker.sock:/var/run/docker.sock'

  splunk-cm:
    image: splunk/splunk:latest
    platform: linux/amd64
    hostname: splunk-cm
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=Splunk123!
      - SPLUNK_ROLE=splunk_cluster_master
    ports:
      - '8000:8000'
      - '8089:8089'
    volumes:
      - './default.yml:/tmp/defaults/default.yml'

  splunk-idx:
    image: splunk/splunk:latest
    platform: linux/amd64
    hostname: splunk-idx
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=Splunk123!
      - SPLUNK_ROLE=splunk_indexer
      - SPLUNK_CLUSTER_MASTER_URL=splunk-cm
    depends_on:
      - splunk-cm
    volumes:
      - './default.yml:/tmp/defaults/default.yml'

  splunk-shd:
    image: splunk/splunk:latest
    platform: linux/amd64
    hostname: splunk-shd
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=Splunk123!
      - SPLUNK_ROLE=splunk_deployer
    ports:
      - '8001:8000'
    volumes:
      - './default.yml:/tmp/defaults/default.yml'

  splunk-sh1:
    image: splunk/splunk:latest
    platform: linux/amd64
    hostname: splunk-sh1
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=Splunk123!
      - SPLUNK_ROLE=splunk_search_head
      - SPLUNK_DEPLOYER_URL=splunk-shd
      - SPLUNK_SEARCH_HEAD_URL=splunk-sh1,splunk-sh2,splunk-sh3
      - SPLUNK_SEARCH_HEAD_CAPTAIN_URL=splunk-sh1
    depends_on:
      - splunk-shd
    ports:
      - '8002:8000'
    volumes:
      - './default.yml:/tmp/defaults/default.yml'

  splunk-sh2:
    image: splunk/splunk:latest
    platform: linux/amd64
    hostname: splunk-sh2
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=Splunk123!
      - SPLUNK_ROLE=splunk_search_head
      - SPLUNK_DEPLOYER_URL=splunk-shd
      - SPLUNK_SEARCH_HEAD_URL=splunk-sh1,splunk-sh2,splunk-sh3
      - SPLUNK_SEARCH_HEAD_CAPTAIN_URL=splunk-sh1
    depends_on:
      - splunk-shd
    ports:
      - '8003:8000'
    volumes:
      - './default.yml:/tmp/defaults/default.yml'

  splunk-sh3:
    image: splunk/splunk:latest
    platform: linux/amd64
    hostname: splunk-sh3
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=Splunk123!
      - SPLUNK_ROLE=splunk_search_head
      - SPLUNK_DEPLOYER_URL=splunk-shd
      - SPLUNK_SEARCH_HEAD_URL=splunk-sh1,splunk-sh2,splunk-sh3
      - SPLUNK_SEARCH_HEAD_CAPTAIN_URL=splunk-sh1
    depends_on:
      - splunk-shd
    ports:
      - '8004:8000'
    volumes:
      - './default.yml:/tmp/defaults/default.yml'
