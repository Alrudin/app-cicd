splunk:
  password: "{{ lookup('env', 'SPLUNK_PASSWORD') }}"
  idxc:
    secret: "{{ lookup('env', 'SPLUNK_IDXC_SECRET') }}"
    search_factor: 1
    replication_factor: 1
    replication_port: 9887
  shc:
    secret: "{{ lookup('env', 'SPLUNK_SHC_SECRET') }}"
    replication_factor: 2
    replication_port: 9887
